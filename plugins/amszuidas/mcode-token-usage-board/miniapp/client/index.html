<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MiniMax Code Token 用量看板</title>
<style>
  :root,
  [data-theme='light'] {
    --mcode-bg: #ffffff;
    --mcode-bg-secondary: #f5f5f5;
    --mcode-surface: #ffffff;
    --mcode-surface-muted: #fafafa;
    --mcode-text: #171717;
    --mcode-text-muted: #666666;
    --mcode-text-subtle: #adadad;
    --mcode-border: #0a0a0a14;
    --mcode-border-strong: #0a0a0af2;
    --mcode-accent: #0094fc;
    --mcode-success: #04b54b;
    --mcode-warning: #f56811;
    --mcode-danger: #f73646;
    --mcode-primary-action-bg: #171717;
    --mcode-primary-action-text: #ffffff;
    --mcode-chart-input: #0094fc;
    --mcode-chart-output: #04b54b;
    --mcode-chart-cachewrite: #f56811;
    --mcode-chart-cacheread: #8a63d2;
  }
  [data-theme='dark'] {
    --mcode-bg: #171717;
    --mcode-bg-secondary: #1c1c1c;
    --mcode-surface: #262626;
    --mcode-surface-muted: #262626;
    --mcode-text: #ededed;
    --mcode-text-muted: #949494;
    --mcode-text-subtle: #666666;
    --mcode-border: #ffffff14;
    --mcode-border-strong: #fffffff2;
    --mcode-accent: #0077d9;
    --mcode-success: #009c3d;
    --mcode-warning: #e25507;
    --mcode-danger: #e31937;
    --mcode-primary-action-bg: #ffffff;
    --mcode-primary-action-text: #171717;
    --mcode-chart-input: #3aa9ff;
    --mcode-chart-output: #2fbf68;
    --mcode-chart-cachewrite: #f07a33;
    --mcode-chart-cacheread: #a98aec;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--mcode-bg);
    color: var(--mcode-text);
    font-family: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  .page { max-width: 1080px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-header h1 { font-size: 18px; line-height: 28px; font-weight: 600; margin: 0; }
  .page-header p { margin: 2px 0 0; color: var(--mcode-text-muted); font-size: 12px; line-height: 16px; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  #status-line { color: var(--mcode-text-subtle); font-size: 12px; line-height: 16px; }

  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--mcode-border); border-radius: 8px;
    background: var(--mcode-surface-muted);
    transition: background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
  }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--mcode-accent); outline-offset: 1px; }

  .btn-secondary { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-secondary:hover { border-color: var(--mcode-border-strong); }
  .btn-secondary svg { width: 14px; height: 14px; }
  .btn-secondary[aria-busy='true'] svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar label { color: var(--mcode-text-muted); font-size: 12px; }
  .segmented { display: inline-flex; background: var(--mcode-surface-muted); border: 1px solid var(--mcode-border); border-radius: 8px; padding: 2px; gap: 2px; }
  .segmented button { border: none; background: transparent; border-radius: 6px; height: 28px; padding: 0 12px; color: var(--mcode-text-muted); }
  .segmented button[aria-pressed='true'] { background: var(--mcode-surface); color: var(--mcode-text); box-shadow: 0 0 20px rgb(10 10 10 / 8%); }
  select {
    font: inherit; color: var(--mcode-text);
    height: 32px; padding: 0 8px; max-width: 260px;
    background: var(--mcode-surface); border: 1px solid var(--mcode-border); border-radius: 8px;
  }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi-card { background: var(--mcode-surface); border: 1px solid var(--mcode-border); border-radius: 12px; padding: 16px; }
  .kpi-card h3 { margin: 0; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--mcode-text-muted); display: flex; align-items: center; gap: 6px; }
  .kpi-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .kpi-value { font-size: 24px; line-height: 32px; font-weight: 600; margin-top: 4px; }
  .kpi-sub { font-size: 12px; color: var(--mcode-text-subtle); }

  section.panel { background: var(--mcode-surface); border: 1px solid var(--mcode-border); border-radius: 12px; padding: 20px; }
  section.panel > h2 { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 500; }

  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .chart-head h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
  .metric-toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .metric-toggle { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; color: var(--mcode-text-muted); }
  .metric-toggle[aria-pressed='true'] { color: var(--mcode-text); border-color: var(--mcode-border-strong); }
  .metric-toggle .kpi-dot { opacity: 0.35; }
  .metric-toggle[aria-pressed='true'] .kpi-dot { opacity: 1; }
  .chart-scroll { overflow-x: auto; }
  #chart-svg { display: block; }
  .chart-empty, .table-empty { color: var(--mcode-text-subtle); padding: 24px 0; text-align: center; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--mcode-border); margin-bottom: 12px; }
  .tabs button { border: none; background: transparent; border-radius: 0; padding: 8px 12px; color: var(--mcode-text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected='true'] { color: var(--mcode-text); border-bottom-color: var(--mcode-border-strong); }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--mcode-border); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--mcode-text-muted); font-weight: 400; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:hover { background: var(--mcode-surface-muted); }
  td.total-cell { font-weight: 600; }
  .cell-title { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-sub { color: var(--mcode-text-subtle); font-size: 12px; }

  [role='alert'] {
    border: 1px solid var(--mcode-danger); border-radius: 8px;
    color: var(--mcode-danger); padding: 10px 14px; font-size: 13px;
  }
  .hidden { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 768px) {
    .page { padding: 16px; gap: 16px; }
    section.panel { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>MiniMax Code Token 用量看板</h1>
      <p>统计本机 MiniMax Code 会话的每日 token 消耗，可按模型和会话筛选</p>
    </div>
    <div class="header-actions">
      <span id="status-line" role="status">加载中…</span>
      <button type="button" id="refresh-btn" class="btn-secondary" aria-busy="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke-linecap="round"/>
          <path d="M13.7 1.8v2.8h-2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        刷新
      </button>
    </div>
  </header>

  <div id="error-box" role="alert" class="hidden"></div>

  <section class="toolbar" aria-label="筛选条件">
    <div class="segmented" role="group" aria-label="时间范围" id="range-group">
      <button type="button" data-range="today" aria-pressed="false">今天</button>
      <button type="button" data-range="7d" aria-pressed="true">近 7 天</button>
      <button type="button" data-range="30d" aria-pressed="false">近 30 天</button>
      <button type="button" data-range="all" aria-pressed="false">全部</button>
    </div>
    <label for="model-select">模型</label>
    <select id="model-select"><option value="">全部模型</option></select>
    <label for="session-select">会话</label>
    <select id="session-select"><option value="">全部会话</option></select>
  </section>

  <section class="kpi-grid" aria-label="用量总览" id="kpi-grid"></section>

  <section class="panel" aria-label="每日趋势">
    <div class="chart-head">
      <h2>每日趋势</h2>
      <div class="metric-toggles" role="group" aria-label="图表指标开关" id="metric-toggles"></div>
    </div>
    <div class="chart-scroll" id="chart-container"></div>
  </section>

  <section class="panel" aria-label="明细数据">
    <div class="tabs" role="tablist" aria-label="明细视图">
      <button type="button" role="tab" id="tab-day" aria-selected="true" aria-controls="panel-day">按日</button>
      <button type="button" role="tab" id="tab-model" aria-selected="false" aria-controls="panel-model">按模型</button>
      <button type="button" role="tab" id="tab-session" aria-selected="false" aria-controls="panel-session">按会话</button>
    </div>
    <div id="panel-day" role="tabpanel" aria-labelledby="tab-day"></div>
    <div id="panel-model" role="tabpanel" aria-labelledby="tab-model" class="hidden"></div>
    <div id="panel-session" role="tabpanel" aria-labelledby="tab-session" class="hidden"></div>
  </section>
</div>

<script>
(() => {
  'use strict';

  // ---- theme ----------------------------------------------------------
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const applyTheme = () => document.documentElement.setAttribute('data-theme', media.matches ? 'dark' : 'light');
  applyTheme();
  media.addEventListener('change', applyTheme);

  // ---- constants and state --------------------------------------------
  const METRICS = [
    { key: 'input', label: '输入', cssVar: '--mcode-chart-input' },
    { key: 'output', label: '输出', cssVar: '--mcode-chart-output' },
    { key: 'cacheWrite', label: '缓存创建', cssVar: '--mcode-chart-cachewrite' },
    { key: 'cacheRead', label: '缓存读取', cssVar: '--mcode-chart-cacheread' },
  ];
  const state = {
    records: [],
    generatedAt: null,
    scannedFiles: 0,
    range: '7d',
    model: '',
    session: '',
    metricsOn: new Set(METRICS.map((m) => m.key)),
    activeTab: 'day',
    loaded: false,
  };

  const $ = (id) => document.getElementById(id);
  const nfFull = new Intl.NumberFormat('zh-CN');

  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 1 : 2) + 'K';
    return String(n);
  }
  function localDayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function rangeCutoff() {
    if (state.range === 'all') return null;
    const days = state.range === 'today' ? 1 : state.range === '7d' ? 7 : 30;
    const d = new Date();
    d.setDate(d.getDate() - (days - 1));
    return localDayKey(d);
  }
  function filteredRecords() {
    const cutoff = rangeCutoff();
    return state.records.filter((r) =>
      (!cutoff || r.day >= cutoff) &&
      (!state.model || r.model === state.model) &&
      (!state.session || r.sessionId === state.session));
  }
  function sumRecords(records) {
    const acc = { calls: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
    for (const r of records) {
      acc.calls += r.calls; acc.input += r.input; acc.output += r.output;
      acc.cacheRead += r.cacheRead; acc.cacheWrite += r.cacheWrite;
    }
    return acc;
  }
  const totalOf = (r) => r.input + r.output + r.cacheRead + r.cacheWrite;

  function groupBy(records, keyFn) {
    const map = new Map();
    for (const r of records) {
      const key = keyFn(r);
      let g = map.get(key);
      if (!g) { g = { calls: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0, rows: [] }; map.set(key, g); }
      g.calls += r.calls; g.input += r.input; g.output += r.output;
      g.cacheRead += r.cacheRead; g.cacheWrite += r.cacheWrite; g.rows.push(r);
    }
    return map;
  }

  // ---- KPI ---------------------------------------------------------------
  function renderKpis(records) {
    const sums = sumRecords(records);
    const total = sums.input + sums.output + sums.cacheRead + sums.cacheWrite;
    const cards = [
      { label: '总 token', value: total, sub: '调用 ' + nfFull.format(sums.calls) + ' 次', dot: null },
      ...METRICS.map((m) => ({ label: m.label + ' tokens', value: sums[m.key], sub: total > 0 ? (sums[m.key] / total * 100).toFixed(1) + '%' : '—', dot: m.cssVar })),
    ];
    $('kpi-grid').innerHTML = cards.map((c) => `
      <article class="kpi-card">
        <h3>${c.dot ? `<span class="kpi-dot" style="background: var(${c.dot})"></span>` : ''}${c.label}</h3>
        <div class="kpi-value" title="${nfFull.format(c.value)}">${fmt(c.value)}</div>
        <div class="kpi-sub">${c.sub}</div>
      </article>`).join('');
  }

  // ---- chart ---------------------------------------------------------------
  function renderMetricToggles() {
    $('metric-toggles').innerHTML = METRICS.map((m) => `
      <button type="button" class="metric-toggle" data-metric="${m.key}" aria-pressed="${state.metricsOn.has(m.key)}">
        <span class="kpi-dot" style="background: var(${m.cssVar})"></span>${m.label}
      </button>`).join('');
    for (const btn of $('metric-toggles').querySelectorAll('button')) {
      btn.addEventListener('click', () => {
        const key = btn.dataset.metric;
        if (state.metricsOn.has(key)) {
          if (state.metricsOn.size === 1) return; // keep at least one metric
          state.metricsOn.delete(key);
        } else {
          state.metricsOn.add(key);
        }
        btn.setAttribute('aria-pressed', String(state.metricsOn.has(key)));
        renderChart(filteredRecords());
      });
    }
  }

  function renderChart(records) {
    const container = $('chart-container');
    const byDay = groupBy(records, (r) => r.day);
    const days = [...byDay.keys()].sort();
    if (days.length === 0) {
      container.innerHTML = '<div class="chart-empty">当前筛选条件下没有用量数据</div>';
      return;
    }
    const active = METRICS.filter((m) => state.metricsOn.has(m.key));
    const dayTotals = days.map((d) => active.reduce((s, m) => s + byDay.get(d)[m.key], 0));
    const maxTotal = Math.max(...dayTotals, 1);

    const barW = 26, gap = 14, padL = 56, padR = 12, padT = 10, padB = 30, chartH = 220;
    const width = Math.max(padL + padR + days.length * (barW + gap), 420);
    const height = chartH + padT + padB;
    const y = (v) => padT + chartH - (v / maxTotal) * chartH;

    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const v = (maxTotal / 4) * i, gy = y(v);
      grid += `<line x1="${padL}" y1="${gy}" x2="${width - padR}" y2="${gy}" stroke="var(--mcode-border)" />
        <text x="${padL - 8}" y="${gy + 4}" text-anchor="end" font-size="11" fill="var(--mcode-text-subtle)">${fmt(Math.round(v))}</text>`;
    }

    let bars = '';
    days.forEach((day, i) => {
      const g = byDay.get(day);
      const x = padL + i * (barW + gap);
      let cursor = padT + chartH;
      let segs = '';
      for (const m of active) {
        const v = g[m.key];
        if (v <= 0) continue;
        const h = Math.max((v / maxTotal) * chartH, v > 0 ? 1 : 0);
        cursor -= h;
        segs += `<rect x="${x}" y="${cursor}" width="${barW}" height="${h}" rx="2" fill="var(${m.cssVar})"></rect>`;
      }
      const tip = day + '\n' + active.map((m) => m.label + ': ' + nfFull.format(g[m.key])).join('\n') + '\n合计: ' + nfFull.format(dayTotals[i]);
      bars += `<g role="listitem"><title>${tip}</title>${segs}
        <rect x="${x - gap / 2}" y="${padT}" width="${barW + gap}" height="${chartH}" fill="transparent"></rect>
        <text x="${x + barW / 2}" y="${height - 10}" text-anchor="middle" font-size="11" fill="var(--mcode-text-muted)">${day.slice(5)}</text></g>`;
    });

    const label = '每日 token 用量堆叠柱状图，共 ' + days.length + ' 天，包含指标：' + active.map((m) => m.label).join('、');
    container.innerHTML = `<svg id="chart-svg" role="img" aria-label="${label}" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${grid}${bars}</svg>`;
  }

  // ---- tables ---------------------------------------------------------------
  const HEAD = '<th scope="col">调用</th><th scope="col">输入</th><th scope="col">输出</th><th scope="col">缓存创建</th><th scope="col">缓存读取</th><th scope="col">总计</th>';
  function numCells(g) {
    const total = g.input + g.output + g.cacheRead + g.cacheWrite;
    const cell = (v) => `<td title="${nfFull.format(v)}">${fmt(v)}</td>`;
    return `<td>${nfFull.format(g.calls)}</td>${cell(g.input)}${cell(g.output)}${cell(g.cacheWrite)}${cell(g.cacheRead)}<td class="total-cell" title="${nfFull.format(total)}">${fmt(total)}</td>`;
  }
  function tableOrEmpty(caption, headFirst, rowsHtml) {
    if (!rowsHtml) return '<div class="table-empty">当前筛选条件下没有用量数据</div>';
    return `<div class="table-wrap"><table>
      <caption class="visually-hidden">${caption}</caption>
      <thead><tr><th scope="col">${headFirst}</th>${HEAD}</tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>`;
  }
  function renderDayTable(records) {
    const byDay = groupBy(records, (r) => r.day);
    const rows = [...byDay.keys()].sort().reverse().map((day) => {
      const g = byDay.get(day);
      const models = new Set(g.rows.map((r) => r.model)).size;
      const sessions = new Set(g.rows.map((r) => r.sessionId)).size;
      return `<tr><td>${day}<span class="cell-sub"> · ${models} 个模型 · ${sessions} 个会话</span></td>${numCells(g)}</tr>`;
    }).join('');
    $('panel-day').innerHTML = tableOrEmpty('按日 token 用量明细', '日期', rows);
  }
  function renderModelTable(records) {
    const byModel = groupBy(records, (r) => r.model);
    const grand = sumRecords(records);
    const grandTotal = grand.input + grand.output + grand.cacheRead + grand.cacheWrite;
    const entries = [...byModel.entries()].sort((a, b) => totalOf(b[1]) - totalOf(a[1]));
    const rows = entries.map(([model, g]) => {
      const share = grandTotal > 0 ? (totalOf(g) / grandTotal * 100).toFixed(1) + '%' : '—';
      return `<tr><td><span class="mono">${model}</span><span class="cell-sub"> · 占比 ${share}</span></td>${numCells(g)}</tr>`;
    }).join('');
    $('panel-model').innerHTML = tableOrEmpty('按模型 token 用量明细', '模型', rows);
  }
  function renderSessionTable(records) {
    const bySession = groupBy(records, (r) => r.sessionId);
    const entries = [...bySession.entries()].sort((a, b) => totalOf(b[1]) - totalOf(a[1]));
    const rows = entries.map(([sid, g]) => {
      const title = g.rows[0].title || sid;
      const models = new Set(g.rows.map((r) => r.model));
      const days = new Set(g.rows.map((r) => r.day));
      return `<tr><td>
          <div class="cell-title" title="${title.replace(/"/g, '&quot;')}">${title}</div>
          <div class="cell-sub mono">${sid}</div>
          <div class="cell-sub">${[...models].join('、')} · 活跃 ${days.size} 天</div>
        </td>${numCells(g)}</tr>`;
    }).join('');
    $('panel-session').innerHTML = tableOrEmpty('按会话 token 用量明细', '会话', rows);
  }

  // ---- filters / tabs -------------------------------------------------------
  function refreshFilterOptions() {
    const models = [...new Set(state.records.map((r) => r.model))].sort();
    const modelSel = $('model-select');
    modelSel.innerHTML = '<option value="">全部模型</option>' +
      models.map((m) => `<option value="${m}" ${m === state.model ? 'selected' : ''}>${m}</option>`).join('');
    if (state.model && !models.includes(state.model)) state.model = '';

    const bySession = groupBy(state.records, (r) => r.sessionId);
    const sessions = [...bySession.entries()].sort((a, b) => totalOf(b[1]) - totalOf(a[1]));
    const sessionSel = $('session-select');
    sessionSel.innerHTML = '<option value="">全部会话</option>' +
      sessions.map(([sid, g]) => {
        const t = (g.rows[0].title || sid);
        const label = t.length > 36 ? t.slice(0, 36) + '…' : t;
        return `<option value="${sid}" ${sid === state.session ? 'selected' : ''}>${label.replace(/</g, '&lt;')}</option>`;
      }).join('');
    if (state.session && !bySession.has(state.session)) state.session = '';
  }

  function renderAll() {
    const records = filteredRecords();
    renderKpis(records);
    renderChart(records);
    renderDayTable(records);
    renderModelTable(records);
    renderSessionTable(records);
  }

  $('range-group').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-range]');
    if (!btn) return;
    state.range = btn.dataset.range;
    for (const b of $('range-group').querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b === btn));
    }
    renderAll();
  });
  $('model-select').addEventListener('change', (e) => { state.model = e.target.value; renderAll(); });
  $('session-select').addEventListener('change', (e) => { state.session = e.target.value; renderAll(); });

  const TABS = ['day', 'model', 'session'];
  for (const t of TABS) {
    $('tab-' + t).addEventListener('click', () => {
      state.activeTab = t;
      for (const x of TABS) {
        $('tab-' + x).setAttribute('aria-selected', String(x === t));
        $('panel-' + x).classList.toggle('hidden', x !== t);
      }
    });
  }

  // ---- data loading ---------------------------------------------------------
  const ERROR_TEXT = {
    data_root_missing: '未找到本机 MiniMax Code 会话数据目录，暂无可统计的用量。',
    parse_empty: '找到会话记录但无法解析出 token 用量，数据格式可能已变化。',
    internal_error: '服务端处理失败，请稍后重试。',
  };

  async function loadData(silent) {
    const btn = $('refresh-btn');
    btn.setAttribute('aria-busy', 'true');
    if (!silent) $('status-line').textContent = '加载中…';
    try {
      const res = await fetch('/api/usage', { cache: 'no-store' });
      const body = await res.json();
      if (!res.ok || body.error) throw new Error(body.error || 'http_' + res.status);
      state.records = Array.isArray(body.records) ? body.records : [];
      state.generatedAt = body.generatedAt;
      state.scannedFiles = body.scannedFiles;
      state.loaded = true;
      $('error-box').classList.add('hidden');
      refreshFilterOptions();
      renderAll();
      const time = new Date(body.generatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      $('status-line').textContent = `已更新 ${time} · ${body.scannedFiles} 个会话文件`;
    } catch (err) {
      const box = $('error-box');
      box.textContent = '加载用量数据失败：' + (ERROR_TEXT[err.message] || '网络或服务异常，请点击“刷新”重试。');
      box.classList.remove('hidden');
      if (!state.loaded) $('status-line').textContent = '加载失败';
    } finally {
      btn.setAttribute('aria-busy', 'false');
    }
  }

  $('refresh-btn').addEventListener('click', () => loadData(false));
  renderMetricToggles();
  loadData(false);
  setInterval(() => loadData(true), 60000);
})();
</script>
</body>
</html>
